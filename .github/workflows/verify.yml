# =============================================================================
#  tree-sitter-mulesoft · GitHub Actions
# -----------------------------------------------------------------------------
#  File                verify.yml
#  Workflow name       Verify
#  Type                Entrypoint (runs in this repo only)
#  Triggers            pull_request
#                      push (dev, main)
#  Purpose             Regenerate the parsers from grammar.js, fail on any
#                      drift in the generated parsers or the committed
#                      node-kind snapshots, run the tree-sitter corpus and
#                      highlight tests, parse fixtures, build and test the
#                      Rust bindings (against the tree-sitter version the
#                      consumers pin, and against the latest), build and test
#                      the Node bindings, validate the PR title, scan for
#                      secrets, and lint workflow/YAML files. A final aggregate
#                      job rolls every check up into a single `Verify` status.
# =============================================================================

name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate conventional PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            revert
            ci
            build
            security

  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Gitleaks
        id: cache-gitleaks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-linux-x64

      - name: Install Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          asset="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tmp/$asset" "$base/$asset"
          curl -sSfL -o "$tmp/checksums.txt" "$base/gitleaks_${VERSION}_checksums.txt"
          ( cd "$tmp" && grep " $asset\$" checksums.txt | sha256sum --check - )
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tmp/$asset" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" "$HOME/.local/bin/gitleaks"

      - name: Run Gitleaks
        run: $HOME/.local/bin/gitleaks detect --source . --exit-code 1 --report-format json --report-path gitleaks-report.json

  verify:
    name: Grammar, fixtures, Rust build/test
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0 rustc stable as of 2026-08-17
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install the tree-sitter CLI
        run: npm install --no-save tree-sitter-cli@0.27.0

      - name: Regenerate DataWeave parser from grammar.js
        run: |
          cd dataweave
          npx --yes --package=tree-sitter-cli@0.27.0 -- tree-sitter generate
          cd ..

      - name: Fail if DataWeave generated parser is out of date
        run: git diff --exit-code -- dataweave/src/parser.c dataweave/src/grammar.json dataweave/src/node-types.json

      - name: Regenerate RAML parser from grammar.js
        run: |
          cd raml
          npx --yes --package=tree-sitter-cli@0.27.0 -- tree-sitter generate
          cd ..

      - name: Fail if RAML generated parser is out of date
        run: git diff --exit-code -- raml/src/parser.c raml/src/grammar.json raml/src/node-types.json

      - name: Fail if node-kind snapshots are out of date
        run: |
          cd dataweave
          node test/generate-node-kinds.mjs
          git diff --exit-code -- test/node-kinds.txt
          cd ../raml
          node test/generate-node-kinds.mjs
          git diff --exit-code -- test/node-kinds.txt
          cd ..

      - name: Run DataWeave corpus and highlight tests
        run: |
          cd dataweave
          npx --yes --package=tree-sitter-cli@0.27.0 -- tree-sitter test
          cd ..

      - name: Run RAML corpus and highlight tests
        run: |
          cd raml
          npx --yes --package=tree-sitter-cli@0.27.0 -- tree-sitter test
          cd ..

      - name: Parse DataWeave fixtures and fail on ERROR/MISSING
        run: |
          set -euo pipefail
          cd dataweave
          output=$(npx --yes --package=tree-sitter-cli@0.27.0 -- tree-sitter parse test/fixtures/*.dwl 2>&1) || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -qE 'ERROR|MISSING'; then
            echo '::error::DataWeave fixture parse produced ERROR or MISSING nodes.'
            exit 1
          fi
          cd ..

      - name: Parse RAML fixtures and fail on ERROR/MISSING
        run: |
          set -euo pipefail
          cd raml
          output=$(npx --yes --package=tree-sitter-cli@0.27.0 -- tree-sitter parse test/fixtures/*.raml 2>&1) || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -qE 'ERROR|MISSING'; then
            echo '::error::RAML fixture parse produced ERROR or MISSING nodes.'
            exit 1
          fi
          cd ..

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo build & test
        run: cargo test

  consumer-pin:
    name: Rust build/test against tree-sitter 0.26 (the consumers' pin)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0 rustc stable as of 2026-08-17
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: consumer-pin

      # The consumers are not on the same pin: cadence declares
      # tree-sitter = "0.26", marlin "0.27". The verify job above covers 0.27
      # (the dev-dependency in each grammar's Cargo.toml); this job covers the
      # lower bound, so the generated parsers are proven against both.
      - name: Pin tree-sitter to 0.26 and test
        run: |
          sed -i 's/^tree-sitter = .*/tree-sitter = "0.26"/' dataweave/Cargo.toml raml/Cargo.toml
          cargo test

  node-binding:
    name: Node binding build/test
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Install dependencies and test DataWeave Node binding
        run: |
          cd dataweave
          npm install
          npm test
          cd ..

      - name: Install dependencies and test RAML Node binding
        run: |
          cd raml
          npm install
          npm test
          cd ..

  workflow-meta:
    name: Workflow and YAML checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: '1.7.12'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache actionlint
        id: cache-actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/actionlint
          key: actionlint-linux-amd64-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ env.ACTIONLINT_VERSION }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          asset="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$tmp/$asset" "$base/$asset"
          curl -sSfL -o "$tmp/checksums.txt" "$base/actionlint_${VERSION}_checksums.txt"
          ( cd "$tmp" && grep " $asset\$" checksums.txt | sha256sum --check - )
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tmp/$asset" -C "$tmp" actionlint
          install -m 0755 "$tmp/actionlint" "$HOME/.local/bin/actionlint"

      - name: Run actionlint
        run: $HOME/.local/bin/actionlint -color -ignore 'SC[0-9]+:(info|style):'

      - name: Validate YAML files
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 - <<'PYEOF'
          import sys
          import yaml
          from pathlib import Path

          ignored = {".git", "node_modules", "target", "dist"}
          failures = []
          for path in Path(".").rglob("*.y*ml"):
              if any(part in ignored for part in path.parts):
                  continue
              try:
                  with path.open("r", encoding="utf-8") as f:
                      list(yaml.safe_load_all(f))
              except yaml.YAMLError as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("Invalid YAML found:")
              for failure in failures:
                  print(f"  {failure}")
              sys.exit(1)
          print("All YAML files parsed cleanly.")
          PYEOF

  ci:
    name: ${{ github.event_name == 'pull_request' && 'Verify' || 'Verify (push)' }}
    needs: [verify, consumer-pin, node-binding, secret-scanning, pr-title, workflow-meta]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a full run for a ready PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::The full verify suite runs when this draft is marked ready for review.'
          exit 1

      - name: Fail if any job failed or was cancelled
        if: always()
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo '::error::One or more required jobs failed or were cancelled.'
            exit 1
          fi
