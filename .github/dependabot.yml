version: 2

updates:
  - package-ecosystem: cargo
    directory: /dataweave
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: chore
      include: scope
    labels: [dependabot, rust]

  - package-ecosystem: cargo
    directory: /raml
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: chore
      include: scope
    labels: [dependabot, rust]

  - package-ecosystem: npm
    directory: /dataweave
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/New_York
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary
    rebase-strategy: auto
    commit-message:
      prefix: chore
      include: scope
    labels: [dependabot, javascript]

  - package-ecosystem: npm
    directory: /raml
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary
    rebase-strategy: auto
    commit-message:
      prefix: chore
      include: scope
    labels: [dependabot, javascript]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "10:15"
      timezone: America/New_York
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: ci
      include: scope
    labels: [dependabot, ci]
